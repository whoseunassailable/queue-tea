<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Commit Chai-n">
  <title>Commit Chai-n</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="72%">
      <stop offset="0" stop-color="#242038"/>
      <stop offset="1" stop-color="#0c0a13"/>
    </radialGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="96" y1="64" x2="416" y2="448">
      <stop offset="0" stop-color="#22d3ee"/>
      <stop offset="1" stop-color="#6366f1"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34304d"/>
      <stop offset="1" stop-color="#14121d"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d99a5b"/>
      <stop offset="1" stop-color="#a65f2e"/>
    </linearGradient>
    <radialGradient id="fadeGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="fade"><rect width="512" height="512" fill="url(#fadeGrad)"/></mask>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#22d3ee" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- The tile: dark glass, a faint grid, a thin neon edge. -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#grid)" mask="url(#fade)"/>
    <ellipse cx="236" cy="446" rx="150" ry="22" fill="#22d3ee" opacity="0.30" filter="url(#soft)"/>
  </g>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="3"/>

  <g transform="translate(26 0)">
  <!-- The symbol, where the steam would be. -->
  <g filter="url(#glow)">
    <path d="M230 252 V104" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <path d="M230 226 C230 196 304 206 304 172 C304 140 230 146 230 118" stroke="url(#accent)" stroke-width="8" stroke-linecap="round" fill="none"/>
    <g fill="#0c0a13" stroke="url(#accent)" stroke-width="7">
      <circle cx="230" cy="226" r="15"/>
      <circle cx="230" cy="168" r="15"/>
      <circle cx="304" cy="172" r="15"/>
      <circle cx="230" cy="104" r="17"/>
    </g>
    <circle cx="230" cy="104" r="7" fill="#22d3ee"/>
  </g>

  <!-- The cup-bot. -->
  <g>

    <path d="M230 282 L230 282" fill="none" stroke="url(#metal)" stroke-width="0" stroke-linecap="round"/>
    <path d="M230 282 L230 282" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M120 282 H340 L318 420 Q316 430 304 430 H156 Q144 430 142 420 Z" fill="url(#metal)"/>
    <path d="M120 282 H340 L318 420 Q316 430 304 430 H156 Q144 430 142 420 Z" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>
    <g stroke="url(#accent)" stroke-opacity="0.35" stroke-width="3" stroke-linecap="round">
      <path d="M146 300 L158 414"/><path d="M314 300 L302 414"/><path d="M134 290 L150 418" stroke-opacity="0.2"/><path d="M326 290 L310 418" stroke-opacity="0.2"/>
    </g>
    <path d="M150 300 L160 396" stroke="#ffffff" stroke-opacity="0.10" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="230" cy="282" rx="110" ry="20" fill="#0d0b14" stroke="url(#accent)" stroke-width="5" filter="url(#glow)"/>
    <ellipse cx="230" cy="284" rx="97" ry="13" fill="url(#liquid)"/>
    <ellipse cx="206" cy="281" rx="34" ry="4" fill="#ffffff" opacity="0.28"/>
    <rect x="158" y="320" width="144" height="54" rx="27" fill="#06050b" stroke="url(#accent)" stroke-opacity="0.85" stroke-width="3"/>
    <g fill="none" stroke="#22d3ee" stroke-width="7" stroke-linecap="round" filter="url(#glow)">
      <path d="M186 355 q14 -17 28 0"/>
      <path d="M246 355 q14 -17 28 0"/>
    </g>
    <circle cx="176" cy="392" r="7" fill="#6366f1" opacity="0.55"/>
    <circle cx="284" cy="392" r="7" fill="#6366f1" opacity="0.55"/>
    <path d="M216 394 q14 11 28 0" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  </g>
  </g>
</svg>
