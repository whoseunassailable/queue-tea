<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Chai-pter">
  <title>Chai-pter</title>
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="72%">
      <stop offset="0" stop-color="#242038"/>
      <stop offset="1" stop-color="#0c0a13"/>
    </radialGradient>
    <linearGradient id="accent" gradientUnits="userSpaceOnUse" x1="96" y1="64" x2="416" y2="448">
      <stop offset="0" stop-color="#fbbf24"/>
      <stop offset="1" stop-color="#f97316"/>
    </linearGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#34304d"/>
      <stop offset="1" stop-color="#14121d"/>
    </linearGradient>
    <linearGradient id="liquid" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#d8964f"/>
      <stop offset="1" stop-color="#b06a30"/>
    </linearGradient>
    <radialGradient id="fadeGrad" cx="50%" cy="45%" r="55%">
      <stop offset="0" stop-color="#fff"/>
      <stop offset="1" stop-color="#000"/>
    </radialGradient>
    <mask id="fade"><rect width="512" height="512" fill="url(#fadeGrad)"/></mask>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#fbbf24" stroke-opacity="0.16" stroke-width="1"/>
    </pattern>
    <clipPath id="tile"><rect x="16" y="16" width="480" height="480" rx="112"/></clipPath>
    <filter id="glow" x="-40%" y="-40%" width="180%" height="180%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <!-- The tile: dark glass, a faint grid, a thin neon edge. -->
  <rect x="16" y="16" width="480" height="480" rx="112" fill="url(#bg)"/>
  <g clip-path="url(#tile)">
    <rect width="512" height="512" fill="url(#grid)" mask="url(#fade)"/>
    <ellipse cx="236" cy="446" rx="150" ry="22" fill="#fbbf24" opacity="0.30" filter="url(#soft)"/>
  </g>
  <rect x="17.5" y="17.5" width="477" height="477" rx="110.5" fill="none" stroke="url(#accent)" stroke-opacity="0.55" stroke-width="3"/>

  <g transform="translate(0 0)">
  <!-- The symbol, where the steam would be. -->
  <g filter="url(#glow)">
    <g fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" opacity="0.7">
      <path d="M206 266 c-12 -14 12 -22 0 -36"/><path d="M254 266 c-12 -14 12 -22 0 -36"/>
    </g>
    <path d="M230 124 C202 102 158 98 116 108 V218 C158 208 202 212 230 232 Z" fill="#0c0a13" fill-opacity="0.7" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M230 124 C258 102 302 98 344 108 V218 C302 208 258 212 230 232 Z" fill="#0c0a13" fill-opacity="0.7" stroke="url(#accent)" stroke-width="6" stroke-linejoin="round"/>
    <path d="M230 124 V232" stroke="url(#accent)" stroke-width="6"/>
    <g stroke="url(#accent)" stroke-width="5" stroke-linecap="round">
      <path d="M140 132 C164 126 188 128 208 136"/><path d="M140 156 C164 150 188 152 208 160"/><path d="M140 180 C160 175 176 176 192 181"/>
      <path d="M252 136 C272 128 296 126 320 132"/><path d="M252 160 C272 152 296 150 320 156"/>
    </g>
    <path d="M296 104 V160 L308 148 L320 160 V100" fill="#f97316" stroke="#0c0a13" stroke-width="2" stroke-linejoin="round"/>
    <g fill="#fbbf24"><circle cx="102" cy="84" r="4"/><circle cx="362" cy="76" r="5"/><circle cx="352" cy="248" r="3"/></g>
  </g>

  <!-- The cup-bot. -->
  <g>

    <path d="M334 306 C394 296 400 388 324 382" fill="none" stroke="url(#metal)" stroke-width="22" stroke-linecap="round"/>
    <path d="M334 306 C394 296 400 388 324 382" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M120 282 H340 L324 398 Q320 430 288 430 H172 Q140 430 136 398 Z" fill="url(#metal)"/>
    <path d="M120 282 H340 L324 398 Q320 430 288 430 H172 Q140 430 136 398 Z" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linejoin="round" filter="url(#glow)"/>

    <path d="M150 300 L160 396" stroke="#ffffff" stroke-opacity="0.10" stroke-width="10" stroke-linecap="round"/>
    <ellipse cx="230" cy="282" rx="110" ry="20" fill="#0d0b14" stroke="url(#accent)" stroke-width="5" filter="url(#glow)"/>
    <ellipse cx="230" cy="284" rx="97" ry="13" fill="url(#liquid)"/>
    <ellipse cx="206" cy="281" rx="34" ry="4" fill="#ffffff" opacity="0.28"/>
    <rect x="158" y="320" width="144" height="54" rx="27" fill="#06050b" stroke="url(#accent)" stroke-opacity="0.85" stroke-width="3"/>
    <g fill="none" stroke="#fbbf24" stroke-width="7" stroke-linecap="round" filter="url(#glow)">
      <path d="M186 355 q14 -17 28 0"/>
      <path d="M246 355 q14 -17 28 0"/>
    </g>
    <circle cx="176" cy="392" r="7" fill="#f97316" opacity="0.55"/>
    <circle cx="284" cy="392" r="7" fill="#f97316" opacity="0.55"/>
    <path d="M216 394 q14 11 28 0" fill="none" stroke="url(#accent)" stroke-width="5" stroke-linecap="round"/>
  </g>
  </g>
</svg>
